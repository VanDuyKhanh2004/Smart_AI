name: CI

on:
  push:
    branches: [main]
    paths:
      - Smart_AI_backend/**
      - Smart_AI_frontend/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_AI_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Smart_AI_backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Run recommendation offline evaluation (regression gate)
        run: npm run evaluate:recommendation -- --fail-under=1.0

      - name: Run RAG offline evaluation (regression gate)
        run: npm run evaluate:rag -- --fail-under=0.90

      - name: Run constraint pipeline offline evaluation (regression gate)
        run: npm run evaluate:pipeline -- --fail-under=1.0

      - name: Run chatbot offline evaluation (regression gate)
        run: npm run evaluate:chatbot -- --fail-under=1.0

  frontend-typecheck-lint-tests-build:
    name: Frontend Type Check, Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_AI_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Smart_AI_frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # File-level parallelism is disabled in CI: several jsdom tests are
      # timing-sensitive and flake under parallel workers, but pass
      # deterministically when test files run serially (388/388).
      - name: Run frontend tests
        run: npm test -- --no-file-parallelism

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate backend image build
        working-directory: Smart_AI_backend
        run: docker build --tag smart-ai-backend:ci .

      - name: Validate frontend image build
        working-directory: Smart_AI_frontend
        run: docker build --tag smart-ai-frontend:ci .
